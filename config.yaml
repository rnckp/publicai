# Model API connections are separate from website retrieval permissions.
# Website tools are hard restricted to www.ausserberg.ch in crawler.py.
# Search uses OpenAI hosted search or local DuckDuckGo; evidence uses the restricted crawler.
mode: openai  # openai or apertus; CLI --mode overrides this.
web_search_enabled: true  # OpenAI hosted search or Apertus DuckDuckGo search.
model:
  provider: openai
  discovery_model: gpt-6-sol
  review_model: gpt-6-luna
  temperature: null
  reasoning_effort: low
  max_tokens: 32000
  timeout: 120
  retries: 2
  request_limit: 24
  tool_calls_limit: 80
  total_tokens_limit: 250000
# Swisscom Apertus 1.5 profile; uses SWISSCOM_KEY from .env.
apertus:
  provider: swisscom
  discovery_model: swiss-ai/Apertus-v1.5-70B
  review_model: swiss-ai/Apertus-v1.5-70B
  temperature: null
  max_tokens: 32000
  timeout: 120
  retries: 2
  requests_per_second: 2  # Includes retries; must be <= 4 (provider limit: 5).
  search_max_results: 5
  search_request_limit: 8
  search_timeout: 10
  search_interval: 1  # Minimum seconds between DuckDuckGo searches; independent of Swisscom.
  request_limit: 24
  tool_calls_limit: 80
  total_tokens_limit: 250000
run_timeout: 600
crawl:
  max_requests: 100
  concurrency: 2
  run_timeout: 600
  request_timeout: 10
  max_redirects: 5
  max_bytes: 5242880
telemetry:
  enabled: false
  send_to_logfire: false
  service_name: municipality-factory
